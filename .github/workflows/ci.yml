name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: civix_user
          POSTGRES_PASSWORD: civix_password
          POSTGRES_DB: civix_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://civix_user:civix_password@localhost:5432/civix_test_db" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U civix_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run database migrations
      run: |
        export FLASK_APP=app.app:app
        flask db upgrade || echo "No migrations to run"

    - name: Check code formatting with black
      run: |
        black --check app/ tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only app/ tests/

    - name: Run linting with flake8
      run: |
        flake8 app/ tests/

    - name: Run linting with ruff
      run: |
        ruff check app/ tests/

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker-compose build --no-cache

    - name: Test Docker containers
      run: |
        docker-compose up -d
        sleep 30

        # Test web container health
        curl -f http://localhost:5000/health || exit 1

        # Cleanup
        docker-compose down
