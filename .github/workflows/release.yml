name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: 'Pre-release identifier (optional)'
        required: false
        type: string
      message:
        description: 'Release message'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para criar tags e releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para git tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create release
        id: create_release
        run: |
          if [ -n "${{ inputs.pre_release }}" ]; then
            NEW_VERSION=$(python scripts/release.py ${{ inputs.version_type }} --pre "${{ inputs.pre_release }}" --message "${{ inputs.message }}")
          else
            NEW_VERSION=$(python scripts/release.py ${{ inputs.version_type }} --message "${{ inputs.message }}")
          fi

          # Extract version from output
          VERSION=$(python scripts/release.py --current | cut -d' ' -f3)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      - name: Push changes and tags
        run: |
          git push origin main
          git push origin --tags

      - name: Get version info for release notes
        id: version_info
        run: |
          python scripts/release.py --info > version_info.txt
          echo "version_info<<EOF" >> $GITHUB_OUTPUT
          cat version_info.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.create_release.outputs.version }}
          release_name: Release v${{ steps.create_release.outputs.version }}
          body: |
            ## CiviX Release v${{ steps.create_release.outputs.version }}

            ${{ inputs.message }}

            ### Version Information
            ```
            ${{ steps.version_info.outputs.version_info }}
            ```

            ### Changes
            - Released via GitHub Actions
            - See commit history for detailed changes

            ### Deployment
            - Docker images available
            - Ready for production deployment
          draft: false
          prerelease: ${{ contains(steps.create_release.outputs.version, '-') }}

      - name: Build and tag Docker images
        run: |
          VERSION="${{ steps.create_release.outputs.version }}"

          # Build images with version tag
          docker build -t civix:$VERSION .
          docker build -t civix:latest .

          echo "Docker images built:"
          echo "- civix:$VERSION"
          echo "- civix:latest"

      - name: Notify success
        run: |
          echo "✅ Release v${{ steps.create_release.outputs.version }} created successfully!"
          echo "🐳 Docker images built and tagged"
          echo "📋 Next steps:"
          echo "   1. Review the release on GitHub"
          echo "   2. Deploy to staging/production"
          echo "   3. Monitor application health"
